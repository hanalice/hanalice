name: Traffic rollup

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: traffic-rollup
  cancel-in-progress: false

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Roll up GitHub + GoatCounter stats
        env:
          TRAFFIC_PAT: ${{ secrets.TRAFFIC_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: python scripts/traffic_rollup.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh README numbers
        env:
          SYNC_SKIP_MASCOT: '1'
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: python scripts/sync.py

      - name: Commit traffic snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "hanalice"
          git config user.email "hanalice@users.noreply.github.com"
          git add data/traffic.json README.md
          if git diff --staged --quiet; then
            echo "No traffic snapshot changes"
            exit 0
          fi
          git commit -m "chore: roll up traffic stats"

          # main 受 ruleset 保护：GITHUB_TOKEN 不能直推，改为更新 bot 分支并开/刷新 PR。
          git push --force origin HEAD:chore/traffic-rollup

          existing="$(gh pr list --base main --head chore/traffic-rollup --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --base main --head chore/traffic-rollup \
              --title "chore: roll up traffic stats" \
              --body "Traffic rollup snapshot for README. main requires a PR (GH013); merge this to publish the counts."
          else
            echo "Updated existing PR #${existing}"
          fi
          gh pr merge --squash --auto chore/traffic-rollup || true
