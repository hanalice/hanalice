name: Traffic rollup

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: traffic-rollup
  cancel-in-progress: false

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Roll up GitHub + GoatCounter stats
        env:
          TRAFFIC_PAT: ${{ secrets.TRAFFIC_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: python scripts/traffic_rollup.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh README numbers
        env:
          SYNC_SKIP_MASCOT: '1'
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
        run: python scripts/sync.py

      - name: Commit traffic snapshot
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "TRAFFIC_PAT is empty; cannot create or merge the traffic PR" >&2
            exit 1
          fi
          git config user.name "hanalice"
          git config user.email "hanalice@users.noreply.github.com"
          git add data/traffic.json README.md
          if git diff --staged --quiet; then
            echo "No traffic snapshot changes"
            exit 0
          fi
          git commit -m "chore: roll up traffic stats"
          git push --force origin HEAD:chore/traffic-rollup

          existing="$(gh pr list --base main --head chore/traffic-rollup --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --base main --head chore/traffic-rollup \
              --title "chore: roll up traffic stats" \
              --body "Automated traffic snapshot. Merged by the Traffic rollup workflow."
          else
            echo "Branch updated on existing PR #${existing}"
          fi

          if ! gh pr merge --squash --delete-branch=false chore/traffic-rollup; then
            echo "Standard merge blocked; retrying with --admin"
            gh pr merge --squash --admin --delete-branch=false chore/traffic-rollup
          fi
